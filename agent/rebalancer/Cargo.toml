[package]
name = "rebalancer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stonkbag rebalancer: signs basket swap legs with a key derived inside OutLayer's TEE, after checking each one against 1Click"

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
