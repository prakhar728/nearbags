[package]
name = "rebalancer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stonkbag rebalancer spike: signs NEAR Intents payloads with a key derived inside OutLayer's TEE"

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
